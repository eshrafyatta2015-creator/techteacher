<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>بوابة المعلم الإلكترونية | مديرية التربية والتعليم – يطا</title>
<meta name="description" content="بوابة دخول معلمي التكنولوجيا — دخول آمن بحساب مستقل لكل معلم.">
<meta name="author" content="مديرية التربية والتعليم – يطا">
<meta name="theme-color" content="#146C4F">
<meta name="color-scheme" content="light">

<link rel="icon" href="./favicon.ico" sizes="48x48">
<link rel="icon" type="image/png" sizes="32x32" href="./icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="./icons/favicon-16.png">
<link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png">
<link rel="apple-touch-icon" sizes="180x180" href="./icons/apple-touch-icon.png">
<link rel="manifest" href="./manifest.webmanifest">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="application-name" content="بوابة المعلم">

<link rel="preload" as="style" href="./css/app.css">
<link rel="stylesheet" href="./css/app.css">
<link rel="stylesheet" href="./css/gateway.css">
</head>
<body>

<main class="auth-wrap">
  <section class="auth-card" aria-labelledby="authTitle">

    <!-- ==================== الترويسة ==================== -->
    <div class="auth-hero">
      <img class="logo" src="./icons/icon-192.png" alt="شعار مديرية التربية والتعليم – يطا" width="62" height="62">
      <p class="org">مديرية التربية والتعليم – يطا</p>
      <h1 id="authTitle">بوابة المعلم الإلكترونية</h1>
      <p class="sub">قسم الإشراف والتأهيل التربوي</p>
    </div>

    <div class="auth-body">

      <!-- ==================== تبويب الدور ==================== -->
      <div class="auth-tabs" role="tablist" aria-label="نوع الحساب">
        <button type="button" role="tab" id="tabTeacher" aria-selected="true" aria-controls="paneTeacher">دخول المعلم</button>
        <button type="button" role="tab" id="tabAdmin" aria-selected="false" aria-controls="paneAdmin">مسؤول النظام</button>
      </div>

      <!-- ==================== رسالة خطأ ==================== -->
      <div class="auth-error" id="authError" hidden role="alert"></div>

      <!-- ==================== نموذج المعلم ==================== -->
      <form id="teacherForm" class="field-group" novalidate>

        <div class="field combo">
          <label for="teacherName">اسم المعلم</label>
          <input type="text" id="teacherName" class="input"
                 placeholder="ابحث عن اسم المعلم واختره"
                 autocomplete="off" autocorrect="off" spellcheck="false"
                 role="combobox" aria-expanded="false" aria-controls="teacherList"
                 aria-autocomplete="list" aria-describedby="teacherHint">
          <ul class="combo-list" id="teacherList" role="listbox" aria-label="أسماء المعلمين" hidden></ul>
          <span class="hint" id="teacherHint">ابحث بالاسم ثم اختر من القائمة.</span>
        </div>

        <div class="picked" id="pickedName" hidden>
          <svg viewBox="0 0 24 24" width="17" height="17" aria-hidden="true"><path fill="currentColor" d="M9 16.17 4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg>
          <span id="pickedNameText"></span>
        </div>

        <div class="field">
          <label for="teacherPass">رقم الهوية / كلمة المرور</label>
          <input type="password" id="teacherPass" class="input"
                 placeholder="أدخل رقم الهوية" inputmode="numeric"
                 autocomplete="current-password" required>
          <span class="hint">كلمة المرور الافتراضية هي رقم الهوية عند أول استخدام.</span>
        </div>

        <button type="submit" class="btn btn-primary btn-lg" id="loginBtn" style="width:100%">
          تسجيل الدخول
        </button>
      </form>

      <!-- ==================== نموذج المسؤول ==================== -->
      <form id="adminForm" class="field-group" novalidate hidden>

        <div class="field">
          <label for="adminName">اسم المسؤول</label>
          <input type="text" id="adminName" class="input"
                 placeholder="أدخل اسم مسؤول النظام"
                 autocomplete="username" autocorrect="off" spellcheck="false" required>
        </div>

        <div class="field">
          <label for="adminPass">كلمة المرور</label>
          <input type="password" id="adminPass" class="input"
                 placeholder="أدخل كلمة المرور"
                 autocomplete="current-password" required>
        </div>

        <button type="submit" class="btn btn-primary btn-lg" id="adminLoginBtn" style="width:100%">
          تسجيل الدخول
        </button>
      </form>

      <!-- ==================== ملاحظات ==================== -->
      <p class="auth-note">
        نسيت كلمة المرور؟ يرجى مراجعة مسؤول النظام لإعادة تعيينها.
      </p>
      <a class="auth-back" href="./index.html">← العودة إلى تطبيق البحث العام</a>

    </div>
  </section>
</main>

<!-- ==================== التوست ==================== -->
<div class="toast-host" id="toastHost" aria-live="polite" aria-atomic="true"></div>

<!-- ==================== السكربتات ==================== -->
<script src="./js/config.js"></script>
<script src="./js/gateway.js"></script>
<script src="./js/auth.js"></script>
<script src="./js/login.js"></script>
</body>
</html>
